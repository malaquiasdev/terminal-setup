# ==============================================================================
# 🪟 Self-Contained TMUX Configuration (Zero External Dependencies)
# Location: ~/.tmux.conf
# ==============================================================================

# --- General Settings ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -sg escape-time 0
set -g mouse on

# Set prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start index at 1
set -g base-index 1
set w -g pane-base-index 1
set -g renumber-windows on

# --- Window & Pane Keybindings ---
# Split panes using \ and - (preserving current directory)
unbind '"'
unbind %
bind \ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Window creation & renaming
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind n next-window

# Preview Popups (interactive session & window pickers in floating popups)
bind-key w choose-tree -Zw "display-popup -w 90% -h 90% -E '~/terminal-setup/tmux/preview.sh \"%%\"'"
bind-key p choose-tree -Zs "display-popup -w 90% -h 90% -E '~/terminal-setup/tmux/preview.sh \"%%\"'"

# Move active window left / right (Ctrl+Shift+Left / Ctrl+Shift+Right)
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Pane navigation (Vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick reload
bind r source-file ~/.tmux.conf \; display-message " Config reloaded!"

# --- Vi Mode & Clipboard Integration ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# Detect OS for clipboard
if-shell 'uname | grep -q Darwin' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"' \
  'if-shell "grep -q Microsoft /proc/version 2>/dev/null" \
     "bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"clip.exe\"" \
     "bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"xclip -in -selection clipboard\""'

# --- Tokyo Night Style Status Bar (Native / Zero Dependencies) ---
set -g status-position top
set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left-length 50
set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] 🪟 #S #[fg=#7aa2f7,bg=#1a1b26,nobold]"

set -g status-right-length 100
set -g status-right "#[fg=#24283b,bg=#1a1b26]#[fg=#7aa2f7,bg=#24283b] %Y-%m-%d  %H:%M #[fg=#7aa2f7,bg=#24283b]#[fg=#15161e,bg=#7aa2f7,bold] #H "

setw -g window-status-format "#[fg=#a9b1d6,bg=#1a1b26]  #I:#W  "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7]#[fg=#15161e,bg=#bb9af7,bold] #I:#W #[fg=#bb9af7,bg=#1a1b26]"

# Border styles
set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#7aa2f7"
