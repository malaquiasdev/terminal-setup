# ==============================================================================
# 🪟 Self-Contained TMUX Configuration (Zero External Dependencies)
# Location: ~/.tmux.conf
# ==============================================================================

# --- General Settings ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -sg escape-time 0
set -g mouse on

# Set prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start index at 1
set -g base-index 1
set w -g pane-base-index 1
set -g renumber-windows on

# --- Window & Pane Keybindings ---
# Split panes using \ and - (preserving current directory)
unbind '"'
unbind %
bind \ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Window creation & renaming
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind n next-window

# Preview Popups (interactive session & window pickers in floating popups)
bind-key w choose-tree -Zw "display-popup -w 90% -h 90% -E '~/terminal-setup/tmux/preview.sh \"%%\"'"
bind-key p choose-tree -Zs "display-popup -w 90% -h 90% -E '~/terminal-setup/tmux/preview.sh \"%%\"'"

# Move active window left / right (Ctrl+Shift+Left / Ctrl+Shift+Right)
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Pane navigation (Vim-style & Arrow Keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Quick reload
bind r source-file ~/.tmux.conf \; display-message " Config reloaded!"

# --- Vi Mode & Clipboard Integration ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# Detect OS for clipboard
if-shell 'uname | grep -q Darwin' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"' \
  'if-shell "grep -q Microsoft /proc/version 2>/dev/null" \
     "bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"clip.exe\"" \
     "bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"xclip -in -selection clipboard\""'

# --- Gruvbox Dark Style Status Bar (Native / Zero Dependencies) ---
set -g status-position top
set -g status-style "bg=#282828,fg=#ebdbb2"

set -g status-left-length 50
set -g status-left "#[fg=#282828,bg=#fe8019,bold] 🪟 #S #[fg=#fe8019,bg=#282828,nobold]"

set -g status-right-length 100
set -g status-right "#[fg=#3c3836,bg=#282828]#[fg=#ebdbb2,bg=#3c3836] %Y-%m-%d  %H:%M #[fg=#fe8019,bg=#3c3836]#[fg=#282828,bg=#fe8019,bold] #H "

setw -g window-status-format "#[fg=#a89984,bg=#282828]  #I:#W  "
setw -g window-status-current-format "#[fg=#282828,bg=#fabd2f]#[fg=#282828,bg=#fabd2f,bold] #I:#W #[fg=#fabd2f,bg=#282828]"

# Border styles
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fe8019"
