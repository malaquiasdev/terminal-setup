# vim: ft=tmux
# Tokyo Night (Night variant) — statusline

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#7aa2f7,bg=#16161e"
set -g status-bg "#16161e"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S:#I.#P #[fg=#7aa2f7,bg=#16161e,nobold,nounderscore,noitalics] "
set -g status-right "#[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] %Y-%m-%d  %H:%M #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#7aa2f7,bold] #h "

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#16161e"
setw -g window-status-format '#[fg=#16161e,bg=#16161e]#[default] #I  #{b:pane_current_path} #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#16161e,bg=#3b4261]#[fg=#7aa2f7,bg=#3b4261,bold] #I #[fg=#3b4261,bg=#7aa2f7] #{b:pane_current_path} #[fg=#7aa2f7,bg=#16161e,nobold]'
