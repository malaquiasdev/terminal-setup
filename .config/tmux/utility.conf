# Display lazygit
bind -r G display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Run Claude Code in a separate session
bind -r y run-shell '\
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

# Preview a session in a popup (grouped session, scrollable).
# Overrides default 'prefix + p' (previous-window).
bind p choose-tree -Zs "display-popup -w 90% -h 90% -E '~/.config/tmux/preview.sh \"%%\"'"

# Preview a specific window in a popup (grouped session, scrollable).
# Overrides default 'prefix + w' (choose-tree).
bind w choose-tree -Zw "display-popup -w 90% -h 90% -E '~/.config/tmux/preview.sh \"%%\"'"
